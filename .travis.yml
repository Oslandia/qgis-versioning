dist: trusty

services:
  - postgresql

addons:
  postgresql: "9.6"
  apt:
    packages:
      - postgresql-9.6-postgis-2.3

before_install:
  - sudo apt search gdal
  - sudo apt search libproj
  - sudo apt-get install -y gdal-bin libproj

before_script:
  - psql -U postgres -c "create extension postgis"
  - createdb testdb && psql -U postgres -d testdb -c 'CREATE EXTENSION postgis;'

install:
  - sudo pip install --upgrade pip
  - sudo pip install -r requirements.txt
  
script:
  - python --version
  - cd test
  - python ./tests.py 127.0.0.1 postgres -v
