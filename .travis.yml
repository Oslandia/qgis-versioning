dist: xenial

services:
  - postgresql

addons:
  postgresql: "9.6"
  apt:
    packages:
      - postgresql-9.6-postgis-2.4

before_install:
  - sudo apt search gdal libspatialite
  - sudo apt-get install -y gdal-bin python-pyspatialite python-psycopg2 python-pip libspatialite7

before_script:
  - psql -U postgres -c "create extension postgis"
  - createdb testdb

install:
  - sudo pip install --upgrade pip
  - sudo pip install -r requirements.txt
  
script:
  - python --version
  - cd test
  - python ./tests.py 127.0.0.1 postgres -v
